<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Küchen-Mischpult · Multi-Timer</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--edge:#26313e;--text:#f5f7fa;--muted:#96a3b3;--accent:#d5f35d;--radius:20px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{height:100dvh;display:flex;flex-direction:column;padding:clamp(10px,1.5vw,20px);gap:clamp(8px,1.2vw,14px);min-height:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;flex-shrink:0;padding:2px 4px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #52643c;background:linear-gradient(140deg,#273622,#161d17);border-radius:12px;color:var(--accent);font-size:21px;font-weight:800}.brand h1{font-weight:780;letter-spacing:.025em;margin:0;font-size:clamp(16px,2vw,21px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:.17em;text-transform:uppercase}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.count-wrap{display:flex;align-items:center;gap:7px;background:#141b23;border:1px solid var(--edge);border-radius:12px;padding:5px 7px 5px 12px}.count-wrap span{font-size:12px;color:var(--muted)}.count-wrap select{background:#202b37;color:#f6f6f6;border:1px solid #374657;border-radius:8px;padding:7px 22px 7px 9px}.toolbtn{border:1px solid #344252;background:#17212b;color:#e8edf4;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:650;white-space:nowrap}.toolbtn:hover{background:#253445}.toolbtn.primary{color:#151a0d;background:var(--accent);border-color:var(--accent)}.toolbtn.primary:hover{background:#e4ff8d}.toolbtn:disabled{opacity:.45;cursor:not-allowed}
.mixer{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));flex:1;min-height:0;gap:clamp(8px,1.1vw,14px)}.channel{--channel:#66d9f6;position:relative;min-height:0;min-width:0;border:1px solid var(--edge);background:linear-gradient(180deg,#19212b 0%,#111820 60%,#10141b 100%);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;padding:clamp(10px,1.3vw,18px);gap:9px}.channel.running{border-color:color-mix(in srgb,var(--channel) 45%,#273443)}.channel.finished{border-color:var(--channel);animation:finishpulse 1s ease-in-out infinite alternate}@keyframes finishpulse{to{box-shadow:inset 0 0 0 2px var(--channel),0 0 23px color-mix(in srgb,var(--channel) 26%,transparent)}}.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}.ch-label{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--channel)}.ch-index{font-size:10px;color:#6e8093;font-weight:700;white-space:nowrap}.name{width:100%;min-width:0;border:0;border-bottom:1px solid #34404e;padding:0 0 8px;color:var(--text);background:transparent;font-weight:800;font-size:clamp(16px,2.25vw,27px);text-align:center;outline:0;text-overflow:ellipsis}.name:focus{border-color:var(--channel)}.time{font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1;text-align:center;font-weight:800;font-size:clamp(25px,4.5vw,66px);white-space:nowrap}.time small{font-size:.38em;color:#a9b3bd;font-weight:700;vertical-align:baseline;margin-left:3px}.time.finished-text{color:var(--channel)}.track-wrap{flex:1;min-height:12px;display:flex;justify-content:center;align-items:stretch;padding:2px 0}.meter{position:relative;width:min(100%,150px);height:100%;border:1px solid #35414b;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(to bottom,#151c25 0,#151c25 17px,#1b2632 18px,#1b2632 19px);box-shadow:inset 0 0 12px #030609;min-height:16px}.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(10% - 1px),rgba(6,12,19,.75) calc(10% - 1px),rgba(6,12,19,.75) 10%);pointer-events:none}.fill{position:absolute;bottom:0;left:0;right:0;height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--channel) 65%,#ffffff),var(--channel) 36%,color-mix(in srgb,var(--channel) 60%,#0b2030));transition:height .35s linear;box-shadow:0 0 19px color-mix(in srgb,var(--channel) 35%,transparent)}.meter .ticks{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:0 5px}.meter .ticks i{height:1px;background:#bdc8d247;display:block;width:100%}.status{flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.13em;font-weight:700;text-transform:uppercase;min-height:14px}.control-block{flex-shrink:0;display:flex;flex-direction:column;gap:8px}.duration{display:flex;justify-content:center;align-items:center;gap:4px}.duration label{display:flex;align-items:center;gap:4px;font-size:10px;color:#8998a8}.duration input{width:clamp(43px,4.5vw,68px);min-width:0;border:1px solid #3b4958;border-radius:8px;background:#0b1118;color:#f3f7fa;text-align:center;padding:7px 1px;font-size:clamp(13px,1.2vw,17px);font-variant-numeric:tabular-nums}.duration input:disabled{opacity:.5}.buttons{display:flex;justify-content:center;gap:6px}.chbtn{border:1px solid #3d4a59;background:#25313e;color:#f7f9fa;border-radius:9px;min-width:0;padding:10px 8px;flex:1;font-size:clamp(11px,1vw,14px);font-weight:750}.chbtn.go{background:var(--channel);color:#071014;border-color:transparent}.chbtn:hover{filter:brightness(1.1)}.chbtn:disabled{opacity:.36;cursor:not-allowed}.footer{color:#738294;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-shrink:0;padding:0 4px}.footer strong{color:#a9bac9}.status-dot{display:inline-block;background:#87d879;width:7px;height:7px;border-radius:50%;margin-right:5px}.setting-note{display:none}.step-panel{flex-shrink:0;border-top:1px solid #33404c;padding-top:5px}.step-panel summary{cursor:pointer;color:#b9c8d8;font-size:11px;font-weight:700;list-style:none;text-align:center;padding:3px}.step-panel summary::-webkit-details-marker{display:none}.step-panel[open] summary{color:var(--channel)}.step-contents{padding-top:7px;display:flex;flex-direction:column;gap:6px}.step-row{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.step-row label{font-size:11px;color:#b9c8d8}.step-row input[type=number]{width:44px;text-align:center;background:#0b1118;border:1px solid #3b4958;border-radius:7px;color:white;padding:5px 1px}.step-name{width:100%;background:#0b1118;border:1px solid #3b4958;border-radius:7px;color:white;padding:6px;font-size:12px}.step-hint{font-size:10px;color:#98a9bb;text-align:center}.step-pending{font-size:11px;color:var(--channel);text-align:center;font-weight:700}.step-on{accent-color:var(--channel)}.toast{position:fixed;z-index:30;left:50%;bottom:22px;transform:translateX(-50%);background:#24333e;color:#fff;border:1px solid #667887;border-radius:12px;padding:12px 17px;max-width:90%;box-shadow:0 10px 40px #0008}.hidden{display:none!important}
@media(max-width:800px){.app{padding:9px;gap:8px}.brand p{display:none}.logo{width:29px;height:29px}.topbar{gap:8px}.toolbtn{padding:8px}.mixer{gap:7px}.channel{border-radius:13px;padding:9px;gap:6px}.time{font-size:clamp(20px,5.4vw,45px)}.name{font-size:clamp(14px,2.5vw,21px)}.ch-head{gap:3px}.footer{font-size:9px}.duration input{width:39px}.meter{width:min(100%,95px)}}
@media(max-height:650px){.app{gap:5px;padding:7px}.topbar{padding:0}.brand h1{font-size:15px}.brand p{display:none}.logo{width:28px;height:28px}.count-wrap{padding:3px 6px}.count-wrap select{padding:4px 14px 4px 5px}.toolbtn{padding:7px 9px}.channel{padding:7px;gap:4px}.ch-head{display:none}.name{font-size:clamp(13px,1.6vw,20px);padding-bottom:3px}.time{font-size:clamp(20px,3.6vw,42px)}.duration input{padding:4px 0;font-size:13px}.chbtn{padding:6px 5px}.footer{display:none}}
@media(max-width:540px){.brand h1{font-size:14px}.count-wrap span{display:none}.toolbtn{font-size:11px}.mixer{gap:6px}.channel{padding:7px;gap:5px}.ch-label,.ch-index{font-size:8px}.name{font-size:14px}.time{font-size:clamp(18px,5.1vw,28px)}.duration{gap:2px}.duration label{font-size:8px;gap:2px}.duration input{width:31px;font-size:11px;padding:4px 0}.chbtn{font-size:10px;padding:7px 2px}.status{font-size:8px}}
/* Markierung fuer den optionalen Zwischenschritt: feste Position im Countdown-Balken */
.step-marker{position:absolute;left:0;right:0;bottom:50%;z-index:4;height:0;border-top:4px solid #fff;filter:drop-shadow(0 1px 3px #000);pointer-events:none;transition:opacity .2s}
.step-marker::before{content:"";position:absolute;right:5px;top:-7px;width:11px;height:11px;background:#fff;border:2px solid #15202c;border-radius:50%}
.step-marker span{position:absolute;left:5px;bottom:7px;padding:3px 5px;border-radius:4px;background:#f6f8fc;color:#141820;font-size:9px;font-weight:900;letter-spacing:.06em;white-space:nowrap;box-shadow:0 2px 6px #0007}
.step-marker.passed{border-color:#c8d2dc99;opacity:.55}
.step-marker.passed::before{background:#b9c4cc}
.step-marker.passed span{background:#9aa6ae;color:#101820}
.step-marker.hidden{display:none}.step-warning{font-size:11px;color:#ffc46b;text-align:center;font-weight:750;line-height:1.35}.step-info{font-size:11px;color:#dfe6ef;text-align:center;min-height:15px}.step-marker span{font-size:10px;background:#fff}.step-marker::before{width:13px;height:13px}

/* Version 2.3: fingertaugliche, aufklappbare Zeiteinstellung */
.duration input.time-pick,.step-row input.time-pick{cursor:pointer;appearance:none;-webkit-appearance:none;min-width:0;border:1px solid #56677a;background:#101a24;color:#f8fbfd;border-radius:9px;font-weight:750;font-variant-numeric:tabular-nums;text-align:center}
.duration input.time-pick{width:clamp(42px,4.4vw,65px);padding:9px 2px}
.step-row input.time-pick{width:48px;padding:8px 2px}
input.time-pick:hover:not(:disabled),input.time-pick:focus{border-color:var(--accent);background:#273443}
input.time-pick:disabled{cursor:not-allowed;opacity:.48}
.time-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.64);display:flex;align-items:flex-end;justify-content:center;padding:15px}
.time-overlay[hidden]{display:none!important}
.time-dialog{width:min(100%,480px);padding:20px;background:#17222d;border:1px solid #526273;border-radius:22px;box-shadow:0 18px 60px #000b;display:flex;flex-direction:column;gap:17px;color:white}
.picker-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.picker-heading{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#aebccb}
.picker-title{font-size:20px;font-weight:800;margin-top:5px}
.picker-close{background:#273745;border:1px solid #475968;border-radius:10px;color:white;padding:8px 12px}
.picker-number{font-size:64px;line-height:1;font-weight:850;letter-spacing:-.04em;text-align:center;color:#d5f35d;font-variant-numeric:tabular-nums}
.picker-range{width:100%;height:34px;accent-color:#d5f35d;cursor:pointer;touch-action:none}
.picker-range-labels{display:flex;justify-content:space-between;color:#94a8ba;font-size:12px;margin-top:-10px}
.picker-actions{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
.picker-actions button{border-radius:11px;padding:12px;background:#283947;color:white;border:1px solid #4d6070;font-size:16px;font-weight:750}
.picker-actions .picker-done{background:#d5f35d;color:#142014;border-color:#d5f35d}
@media(max-width:540px){.duration input.time-pick{width:35px;padding:6px 1px;font-size:12px}.time-dialog{padding:17px}.picker-number{font-size:52px}}
.step-action-caption{margin:1px 0 4px;padding:8px 10px;border-radius:8px;background:#202d39;border-left:3px solid var(--channel);color:#f2f7fc;font-weight:800;font-size:clamp(12px,1.15vw,15px);line-height:1.35;text-align:center;overflow-wrap:anywhere}
.step-action-caption::before{content:"AKTION · ";color:var(--channel);font-size:10px;letter-spacing:.08em}

/* Version 2.3: Zeit UND Handlung im Fähnchen direkt auf dem Balken */
.step-marker .marker-label{display:flex;flex-direction:column;align-items:flex-start;gap:3px;left:6px;right:25px;width:max-content;max-width:calc(100% - 32px);bottom:9px;padding:6px 7px;border-radius:8px;white-space:normal;line-height:1.2;letter-spacing:0;text-align:left}
.step-marker .marker-time{display:block;font-size:14px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.step-marker .marker-action{display:block;font-size:10px;font-weight:750;line-height:1.25;color:#24303b;overflow-wrap:anywhere;hyphens:auto}
.step-marker.passed .marker-action{color:#17232a}

/* Version 2.3: Jeder der acht Kanalzüge besitzt einen gleichwertig sichtbaren Schalter. */
.step-panel{border-top:1px solid #425365;margin-top:1px;padding-top:8px}
.step-panel summary{background:#1d2a35;border:1px solid #44596b;border-radius:9px;padding:11px 7px;color:#e9f3fb;font-size:clamp(11px,1vw,13px);line-height:1.25;transition:background .15s,border-color .15s}
.step-panel summary:hover,.step-panel summary:focus-visible{background:#293b4a;border-color:var(--channel);outline:none}
.step-panel[open] summary{background:color-mix(in srgb,var(--channel) 15%,#17232e);border-color:var(--channel);color:var(--channel)}
.step-contents{padding-top:10px}
@media(max-width:540px){.step-panel summary{font-size:10px;padding:8px 4px}}
/* Zwei voneinander unabhängige Markierungen */
.step-marker-2{border-top-color:#f9b4ff}
.step-marker-2::before{background:#f9b4ff}
.step-marker-2 .marker-label{background:#f6e5fb}
.step-marker-2.passed{border-top-color:#bda6c4}
.step-marker-2.passed .marker-label{background:#a7a0ad}
.step-info{white-space:normal;line-height:1.4}
/* Zwei stets sichtbare Zwischenzeilen je Kanal, auch vor der Konfiguration. */
.step-info{display:flex;flex-direction:column;gap:4px;flex-shrink:0;text-align:left;min-height:43px;margin:0 1px}
.step-overview-line{display:flex;align-items:baseline;gap:7px;min-width:0;font-size:10px;line-height:1.2;color:#cad4df}
.step-overview-tag{color:var(--channel);white-space:nowrap;font-weight:750}
.step-overview-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:540px){.step-overview-line{font-size:9px;gap:4px}}

/* Version 2.3: Kein Zusammendrücken des Zeitbalkens bei Hochformat oder mehreren Reihen. */
html,body{height:auto;min-height:100%;overflow:auto}
body{overflow-x:hidden}
.app{height:auto;min-height:100dvh;overflow:visible}
.mixer{flex:1;min-height:0;grid-template-rows:repeat(var(--rows),minmax(600px,auto));align-content:stretch}
.channel{min-height:600px;overflow:visible}
.track-wrap{flex:1 1 260px;min-height:230px}
.meter{min-height:230px}
/* Ein einzelner Kanal darf den verfügbaren Bildschirm ausfüllen. */
@media(min-height:850px){.mixer{grid-template-rows:repeat(var(--rows),minmax(650px,auto))}.channel{min-height:650px}}
@media(max-width:620px){.mixer{grid-template-rows:repeat(var(--rows),minmax(590px,auto))}.channel{min-height:590px}.track-wrap,.meter{min-height:210px}}
/* Reset-Schaltfläche fügt sich in die bestehende Werkzeugleiste ein. */
.reset-all{border-color:#71505a;color:#ffb4bd}
.reset-all:hover{background:#38252d;border-color:#b47783}

/* V2.4: orangefarbener laufender Kreis als dezente Aktivitätsanzeige */
.channel.running .status::before {
  content: "";
  display: inline-block;
  vertical-align: -2px;
  width: 12px;
  height: 12px;
  margin-right: 8px;
  border: 3px solid #ff971f;
  border-right-color: transparent;
  border-radius: 50%;
  animation: running-circle 1s linear infinite;
}
@keyframes running-circle { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .channel.running .status::before { animation-duration: 3s; }
}

/* V2.6: Ruhiges Blinken des vollständig sichtbaren Alarmbalkens. */
.channel.finished{animation:none}
.channel.alarming .fill{height:100%!important;animation:alarm-breathe 2.4s ease-in-out infinite;transition:none}
@keyframes alarm-breathe{0%,100%{opacity:.85;filter:brightness(1)}50%{opacity:.22;filter:brightness(.8)}}
.channel.alarming .meter{border-color:var(--channel)}
.alarm-stop{background:#402d25;border:1px solid #ffad70;color:#ffe0c4;border-radius:9px;padding:11px 8px;font-size:clamp(12px,1vw,14px);font-weight:800;width:100%}
.alarm-stop:hover{background:#56372a}
@media(prefers-reduced-motion:reduce){.channel.alarming .fill{animation-duration:5s}}
.sound-select{color:#e8edf4;min-width:106px;appearance:auto;-webkit-appearance:menulist}.sound-select option{background:#17212b;color:#f5f7fa}

/* V2.8: Gleichmäßige obere Bedienleiste (Mac und iPad). */
.topbar{flex-direction:column;align-items:stretch;gap:12px}
.toolbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;width:100%;align-items:stretch}
.toolbar > .toolbtn,.toolbar > .count-wrap{height:46px;width:100%;min-width:0;margin:0;border-radius:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.toolbar > .toolbtn{padding:8px 7px;text-align:center;font-size:12px;line-height:1.2}
.toolbar > .sound-select{display:block;text-align:center;text-align-last:center;appearance:auto;-webkit-appearance:menulist;padding:8px 4px}
.toolbar > .count-wrap{padding:5px 7px;gap:6px}
.toolbar > .count-wrap span{white-space:nowrap}
.toolbar > .count-wrap select{min-width:0;max-width:100%;flex:1;padding:7px 5px;font-size:12px}
@media(max-width:950px){.toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.toolbar > .toolbtn,.toolbar > .count-wrap{height:43px}.toolbar > .toolbtn{font-size:11px;padding:7px 3px}.toolbar > .count-wrap select{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">▥</div><div><h1>KÜCHEN-MISCHPULT</h1><p>Multi-Timer · 8 Kanäle · Zwischenmarkierung · Version 2.8</p></div></div>
 <div class="toolbar"><div class="count-wrap"><span>Kanäle</span><select id="count" aria-label="Anzahl der Timer"></select></div><select class="toolbtn sound-select" id="sound" aria-label="Lautstärke des Tons"><option value="off">🔇 Ton aus</option><option value="low">🔈 Leise</option><option value="medium">🔉 Mittel</option><option value="high">🔊 Laut</option></select><button class="toolbtn" id="fullscreen">⛶ Vollbild</button><button class="toolbtn primary" id="allStart">▶ Alle starten</button><button class="toolbtn" id="allStop">Ⅱ Alle pausieren</button><button class="toolbtn reset-all" id="allReset" title="Alle acht Timer und Zwischenschritte löschen">↺ Alle zurücksetzen</button></div>
</header>
<main class="mixer" id="mixer" aria-label="Timer-Mischpult"></main>
<footer class="footer"><span><span class="status-dot"></span><strong>Lokal im Browser</strong> · Neuer Start beginnt bei Null</span><span>Für den Dauerbetrieb Bildschirm-Sperre deaktivieren · Ton nach erster Bedienung</span></footer>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<div class="time-overlay" id="timeOverlay" hidden>
  <div class="time-dialog" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-top"><div><div class="picker-heading" id="pickerChannel">Kanal 01 · Haupttimer</div><div class="picker-title" id="pickerTitle">Stunden einstellen</div></div><button class="picker-close" type="button" id="pickerClose" aria-label="Schließen">✕</button></div>
    <div class="picker-number" id="pickerValue">00</div>
    <input type="range" id="pickerRange" class="picker-range" min="0" max="99" step="1" value="0" aria-label="Zeit einstellen"/>
    <div class="picker-range-labels"><span>0</span><span id="pickerMax">99</span></div>
    <div class="picker-actions"><button type="button" id="pickerMinus" aria-label="Eins weniger">− 1</button><button type="button" id="pickerPlus" aria-label="Eins mehr">+ 1</button><button type="button" id="pickerDone" class="picker-done">Fertig</button></div>
  </div>
</div>
<script>
(()=>{'use strict';
const KEY='kuechenmischpult-v1';
const colors=['#d4ef5a','#50d9e9','#fa9d56','#b596fc','#f77b9d','#83d99c','#f0d16d','#78aaff'];
const names=['Topf 1','Topf 2','Topf 3','Topf 4','Topf 5','Topf 6','Topf 7','Topf 8'];
const $=s=>document.querySelector(s);
function integer(n,fallback=0){let v=Number(n);return Number.isFinite(v)?Math.max(0,Math.floor(v)):fallback}
function defaultTimer(i){return {name:names[i],h:0,m:0,s:0,duration:0,remaining:0,endAt:null,running:false,done:false,startedOnce:false,stepEnabled:false,stepName:'',stepH:0,stepM:0,stepFired:false,step2Enabled:false,step2Name:'',step2H:0,step2M:0,step2Fired:false,alarmActive:false,nextAlarmAt:0}}
let state={count:4,soundLevel:"high",timers:Array.from({length:8},(_,i)=>defaultTimer(i))};
// Absichtlich kein Einlesen alter Timer-Werte: Jeder neue App-Start beginnt bei Null.
// Auf dem aktuellen Bildschirm bleiben die Einstellungen bis zum Neuladen erhalten.
const refs=new Map();let audio=null;let wake=null;let alarmVoices=new Map();let toastTimeout=null;
function save(){/* Neue Sitzung soll ausdrücklich immer leer beginnen. */}
function seconds(h,m,s){return integer(h)*3600+integer(m)*60+integer(s)}
function format(sec){const totalMinutes=Math.ceil(Math.max(0,sec)/60);const h=Math.floor(totalMinutes/60),m=totalMinutes%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2600)}
function primeAudio(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume()}catch(e){}}
function volume(){return {off:0,low:.12,medium:.32,high:.8}[state.soundLevel] ?? .8}
function beep(){if(!volume())return;try{primeAudio();if(!audio)return;let t=audio.currentTime;for(let j=0;j<3;j++){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=j===1?740:880;g.gain.setValueAtTime(0.0001,t+j*.27);g.gain.exponentialRampToValueAtTime(volume(),t+j*.27+.025);g.gain.exponentialRampToValueAtTime(.0001,t+j*.27+.21);o.connect(g);g.connect(audio.destination);o.start(t+j*.27);o.stop(t+j*.27+.23)}}catch(e){}}
// Jeder abgelaufene Kanal besitzt sein eigenes akustisches Alarmsignal.
// Neue Tonfolgen werden alle 3,2 Sekunden gestartet, bis der Kanal quittiert wird.
function alarmBeep(i){
 if(!volume())return;
 try{
  primeAudio();if(!audio)return;
  const gain=audio.createGain();gain.gain.value=1;gain.connect(audio.destination);
  const old=alarmVoices.get(i);if(old){try{old.gain.setValueAtTime(0,audio.currentTime)}catch(e){}}
  alarmVoices.set(i,{gain});
  const now=audio.currentTime;
  for(let j=0;j<3;j++){
   const osc=audio.createOscillator(),vol=audio.createGain();
   osc.type='sine';osc.frequency.value=j===1?660:820;
   const t=now+j*.28;
   vol.gain.setValueAtTime(.0001,t);vol.gain.exponentialRampToValueAtTime(volume(),t+.025);vol.gain.exponentialRampToValueAtTime(.0001,t+.23);
   osc.connect(vol);vol.connect(gain);osc.start(t);osc.stop(t+.24);
  }
 }catch(e){}
}
function stopAlarm(i){
 const t=state.timers[i];t.alarmActive=false;t.nextAlarmAt=0;
 const voice=alarmVoices.get(i);
 if(voice&&audio){try{voice.gain.gain.cancelScheduledValues(audio.currentTime);voice.gain.gain.setValueAtTime(0,audio.currentTime)}catch(e){}}
 alarmVoices.delete(i);
 renderValues();
}
function processAlarms(){
 const now=Date.now();
 state.timers.forEach((t,i)=>{
  if(t.alarmActive&&volume()>0&&now>=t.nextAlarmAt){
   alarmBeep(i);t.nextAlarmAt=now+3200;
  }
 });
}
function notifyStep(i,n){beep();let t=state.timers[i];toast(`${t.name}: ${n===2?t.step2Name:t.stepName}`);if(navigator.vibrate)navigator.vibrate([100,80,100])}
function notifyDone(i){const t=state.timers[i];t.alarmActive=true;t.nextAlarmAt=0;processAlarms();toast(`${t.name}: Zeit abgelaufen!`);if(navigator.vibrate)navigator.vibrate([200,100,200])}
function getRemaining(t){return t.running?Math.max(0,Math.ceil((t.endAt-Date.now())/1000)):t.remaining}
function countdown(i){let t=state.timers[i];if(t.running){t.remaining=getRemaining(t);let elapsed=t.duration-t.remaining;let changed=false;
  for(const n of [1,2]){let prefix=n===1?'step':'step2';let mark=t[prefix+'H']*3600+t[prefix+'M']*60;if(t[prefix+'Enabled']&&!t[prefix+'Fired']&&mark>0&&mark<t.duration&&elapsed>=mark){t[prefix+'Fired']=true;changed=true;notifyStep(i,n)}}
  if(t.remaining<=0){t.running=false;t.remaining=0;t.done=true;t.endAt=null;changed=true;notifyDone(i)}if(changed)save();}}

function updateWake(){const should=state.timers.some(t=>t.running);if(should&&!wake&&'wakeLock' in navigator){navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>{wake=null})}).catch(()=>{})}else if(!should&&wake){wake.release().catch(()=>{});wake=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){state.timers.forEach((_,i)=>countdown(i));renderValues();updateWake()}});
function changeDuration(i){let t=state.timers[i],r=refs.get(i);if(t.running)return;stopAlarm(i);t.h=Math.min(99,integer(r.h.value));t.m=Math.min(59,integer(r.m.value));t.s=0;t.duration=seconds(t.h,t.m,0);t.remaining=t.duration;t.done=false;t.startedOnce=false;t.stepFired=false;t.step2Fired=false;r.h.value=t.h;r.m.value=t.m;save();renderValues()}

let activePicker=null;
function closePicker(){const box=$('#timeOverlay');box.hidden=true;activePicker=null}
function openPicker(i,key,step){
 const t=state.timers[i],r=refs.get(i);
 if(!r||t.running)return;
 const field=step?(key==='h'?(step===2?r.step2H:r.stepH):(step===2?r.step2M:r.stepM)):(key==='h'?r.h:r.m);
 const max=key==='h'?99:59;
 activePicker={i,key,step,field,max};
 $('#pickerChannel').textContent=`KANAL ${String(i+1).padStart(2,'0')} · ${step?'Zwischenschritt '+step:'Haupttimer'} · ${t.name}`;
 $('#pickerTitle').textContent=key==='h'?'Stunden einstellen':'Minuten einstellen';
 $('#pickerRange').max=max;$('#pickerMax').textContent=String(max);
 $('#timeOverlay').hidden=false;setPickerValue(Math.min(max,integer(field.value)),false);
 $('#pickerRange').focus({preventScroll:true});
}
function setPickerValue(value,commit=true){
 if(!activePicker)return;
 const p=activePicker,n=Math.max(0,Math.min(p.max,Math.round(Number(value)||0)));
 $('#pickerRange').value=n;$('#pickerValue').textContent=String(n).padStart(2,'0');
 if(!commit)return;
 p.field.value=n;
 if(p.step){
  const t=state.timers[p.i],r=refs.get(p.i),prefix=p.step===2?'step2':'step';
  t[prefix+'H']=Math.min(99,integer(p.step===2?r.step2H.value:r.stepH.value));t[prefix+'M']=Math.min(59,integer(p.step===2?r.step2M.value:r.stepM.value));
  t[prefix+'Fired']=false;save();renderValues();
 }else changeDuration(p.i);
}
$('#pickerRange').addEventListener('input',e=>setPickerValue(e.target.value));
$('#pickerMinus').addEventListener('click',()=>setPickerValue(Number($('#pickerRange').value)-1));
$('#pickerPlus').addEventListener('click',()=>setPickerValue(Number($('#pickerRange').value)+1));
$('#pickerDone').addEventListener('click',closePicker);
$('#pickerClose').addEventListener('click',closePicker);
$('#timeOverlay').addEventListener('click',e=>{if(e.target===$('#timeOverlay'))closePicker()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activePicker)closePicker()});

function start(i){let t=state.timers[i];if(t.running)return;stopAlarm(i);if(t.done||t.remaining===0){t.remaining=t.duration;t.done=false;t.stepFired=false;t.step2Fired=false}if(!t.remaining){toast('Bitte zuerst eine Zeit einstellen.');return}primeAudio();t.endAt=Date.now()+t.remaining*1000;t.running=true;t.startedOnce=true;save();renderValues();updateWake()}
function pause(i){const t=state.timers[i];if(!t.running)return;t.remaining=getRemaining(t);t.running=false;t.endAt=null;save();renderValues();updateWake()}
function reset(i){stopAlarm(i);let t=state.timers[i];t.running=false;t.done=false;t.endAt=null;t.remaining=t.duration;t.startedOnce=false;t.stepFired=false;t.step2Fired=false;save();renderValues();updateWake()}
function layout(){const n=state.count;const w=window.innerWidth;const maxCols=w>=1250?4:w>=900?3:w>=620?2:1;const cols=Math.min(n,maxCols);const rows=Math.ceil(n/cols);$('#mixer').style.setProperty('--cols',cols);$('#mixer').style.setProperty('--rows',rows)}
function render(){let mixer=$('#mixer');mixer.innerHTML='';refs.clear();layout();for(let i=0;i<state.count;i++){let t=state.timers[i],el=document.createElement('section');el.className='channel';el.style.setProperty('--channel',colors[i]);el.innerHTML=`<div class="ch-head"><span class="ch-label">TOPF ${i+1}</span><span class="ch-index">● TIMER</span></div><input class="name" aria-label="Name von Timer ${i+1}" maxlength="30" spellcheck="false" value=""/><div class="time" aria-label="Restzeit"></div><div class="track-wrap"><div class="meter" role="progressbar" aria-label="Restzeit in Prozent" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="ticks"><i></i><i></i><i></i><i></i><i></i></div><div class="step-marker hidden" aria-label="Markierung für Zwischenschritt"><span class="marker-label"><strong class="marker-time"></strong><small class="marker-action"></small></span></div><div class="step-marker step-marker-2 hidden" aria-label="Markierung für zweiten Zwischenschritt"><span class="marker-label"><strong class="marker-time"></strong><small class="marker-action"></small></span></div></div></div><div class="status"></div><div class="step-info" aria-live="polite"></div><div class="control-block"><div class="duration"><label><input class="hours time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" min="0" max="99" inputmode="numeric" aria-label="Stunden"/> Std</label><label><input class="minutes time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" min="0" max="59" inputmode="numeric" aria-label="Minuten"/> Min</label></div><div class="buttons"><button class="chbtn go" data-action="toggle"></button><button class="chbtn" data-action="reset">↺ Reset</button></div><button class="alarm-stop hidden" type="button" data-action="alarm-stop">🔕 Signal stoppen</button></div><details class="step-panel"><summary>＋ Zwischenschritt einstellen</summary><div class="step-contents"><div class="step-row"><label><input class="step-on" type="checkbox"/> Erinnerung aktiv</label></div><input class="step-name" maxlength="45" aria-label="Aktion beim Zwischenschritt" placeholder="z. B. Pilze dazugeben"/><div class="step-row"><label>Nach</label><input class="step-h time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" min="0" max="99" inputmode="numeric" aria-label="Stunden bis Zwischenschritt"/><label>Std</label><input class="step-m time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" min="0" max="59" inputmode="numeric" aria-label="Minuten bis Zwischenschritt"/><label>Min</label></div><div class="step-action-caption" aria-live="polite"></div><div class="step-hint">Ab Start des Haupttimers · Hauptzeit läuft weiter</div><div class="step-warning" role="status"></div></div></details><details class="step-panel step-panel-2"><summary>＋ Zweiten Zwischenschritt einstellen</summary><div class="step-contents"><div class="step-row"><label><input class="step2-on" type="checkbox"/> Erinnerung aktiv</label></div><input class="step2-name step-name" maxlength="45" aria-label="Aktion beim zweiten Zwischenschritt" placeholder="z. B. Sauce abschmecken"/><div class="step-row"><label>Nach</label><input class="step2-h time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" aria-label="Stunden bis zum zweiten Zwischenschritt"/><label>Std</label><input class="step2-m time-pick" type="text" readonly inputmode="none" title="Antippen zum Einstellen" aria-label="Minuten bis zum zweiten Zwischenschritt"/><label>Min</label></div><div class="step2-action-caption step-action-caption" aria-live="polite"></div><div class="step-hint">Ab Start des Haupttimers · Hauptzeit läuft weiter</div><div class="step2-warning step-warning" role="status"></div></div></details>`;
 const r={el,name:el.querySelector('.name'),time:el.querySelector('.time'),fill:el.querySelector('.fill'),meter:el.querySelector('.meter'),marker:el.querySelector('.step-marker'),marker2:el.querySelector('.step-marker-2'),status:el.querySelector('.status'),stepInfo:el.querySelector('.step-info'),stepWarning:el.querySelector('.step-warning'),h:el.querySelector('.hours'),m:el.querySelector('.minutes'),toggle:el.querySelector('[data-action="toggle"]'),reset:el.querySelector('[data-action="reset"]'),alarmStop:el.querySelector('[data-action="alarm-stop"]'),stepPanel:el.querySelector('.step-panel'),stepPanel2:el.querySelector('.step-panel-2'),step2Warning:el.querySelector('.step2-warning'),step2On:el.querySelector('.step2-on'),step2Name:el.querySelector('.step2-name'),step2ActionCaption:el.querySelector('.step2-action-caption'),step2H:el.querySelector('.step2-h'),step2M:el.querySelector('.step2-m'),stepOn:el.querySelector('.step-on'),stepName:el.querySelector('.step-name'),stepActionCaption:el.querySelector('.step-action-caption'),stepH:el.querySelector('.step-h'),stepM:el.querySelector('.step-m')};r.name.value=t.name;r.h.value=t.h;r.m.value=t.m;r.stepOn.checked=t.stepEnabled;r.stepName.value=t.stepName;r.stepH.value=t.stepH;r.stepM.value=t.stepM;r.step2On.checked=t.step2Enabled;r.step2Name.value=t.step2Name;r.step2H.value=t.step2H;r.step2M.value=t.step2M;
 r.name.addEventListener('input',()=>{t.name=r.name.value;save()});[[r.h,'h',false],[r.m,'m',false],[r.stepH,'h',1],[r.stepM,'m',1],[r.step2H,'h',2],[r.step2M,'m',2]].forEach(([field,key,step])=>field.addEventListener('click',()=>openPicker(i,key,step)));r.toggle.addEventListener('click',()=>{t.running?pause(i):start(i)});r.reset.addEventListener('click',()=>reset(i));r.alarmStop.addEventListener('click',()=>stopAlarm(i));function setStep(){t.stepEnabled=r.stepOn.checked;t.stepName=r.stepName.value.trim();t.stepH=Math.min(99,integer(r.stepH.value));t.stepM=Math.min(59,integer(r.stepM.value));r.stepH.value=t.stepH;r.stepM.value=t.stepM;r.step2On.checked=t.step2Enabled;r.step2Name.value=t.step2Name;r.step2H.value=t.step2H;r.step2M.value=t.step2M;t.stepFired=false;save();renderValues()}[r.stepOn,r.stepName,r.stepH,r.stepM].forEach(node=>node.addEventListener('change',setStep));r.stepName.addEventListener('input',()=>{t.stepName=r.stepName.value.trim();r.stepActionCaption.textContent=t.stepName||'Noch keine Aktion eingetragen';save();renderValues()});function setStep2(){t.step2Enabled=r.step2On.checked;t.step2Name=r.step2Name.value.trim();t.step2H=Math.min(99,integer(r.step2H.value));t.step2M=Math.min(59,integer(r.step2M.value));r.step2H.value=t.step2H;r.step2M.value=t.step2M;t.step2Fired=false;save();renderValues()}
 [r.step2On,r.step2Name,r.step2H,r.step2M].forEach(node=>node.addEventListener('change',setStep2));r.step2Name.addEventListener('input',()=>{t.step2Name=r.step2Name.value.trim();save();renderValues()});
 refs.set(i,r);mixer.appendChild(el)}renderValues()}
function renderValues(){for(let i=0;i<state.count;i++){
 const t=state.timers[i],r=refs.get(i);if(!r)continue;
 r.stepActionCaption.textContent=t.stepName||'Noch keine Aktion eingetragen';r.step2ActionCaption.textContent=t.step2Name||'Noch keine Aktion eingetragen';
 const left=getRemaining(t),pct=t.duration?Math.min(100,Math.max(0,100*left/t.duration)):0;
 r.time.textContent=format(left);r.time.classList.toggle('finished-text',t.done);r.fill.style.height=pct+'%';
 const notes=[];let invalidAny=false;let lastTriggered='';
 for(const n of [1,2]){
  const prefix=n===1?'step':'step2',marker=n===1?r.marker:r.marker2,warning=n===1?r.stepWarning:r.step2Warning;
  const on=t[prefix+'Enabled'],sec=t[prefix+'H']*3600+t[prefix+'M']*60;
  const valid=on&&t.duration>0&&sec>0&&sec<t.duration;
  marker.classList.toggle('hidden',!valid);
  const invalid=on&&!valid;
  warning.textContent=invalid?(sec===0?'Bitte eine Zwischenzeit größer als 0 eingeben.':'Zwischenschritt muss vor dem Ende des Haupttimers liegen.') : '';
  if(invalid)invalidAny=true;
  if(valid){
   const passed=t[prefix+'Fired']||(t.startedOnce&&left<=t.duration-sec);
   marker.style.bottom=(100*(t.duration-sec)/t.duration)+'%';marker.classList.toggle('passed',passed);
   marker.querySelector('.marker-time').textContent=(passed?'✓ ':'◆ ')+format(sec);
   marker.querySelector('.marker-action').textContent=t[prefix+'Name']||'Aktion';marker.title=t[prefix+'Name']+' · nach '+format(sec);
   notes.push((passed?'✓ ':'◆ ')+t[prefix+'Name']+' · '+format(sec));
   if(t[prefix+'Fired'])lastTriggered=t[prefix+'Name'];
  }
  const panel=n===1?r.stepPanel:r.stepPanel2;
  panel.querySelector('summary').textContent=on?(t[prefix+'Fired']?'✓ ':'◆ ')+`Zwischenschritt ${n} · bearbeiten`:`＋ Zwischenschritt ${n} einstellen`;
 }
 r.stepInfo.innerHTML='';
 for(const n of [1,2]){
  const prefix=n===1?'step':'step2';const enabled=t[prefix+'Enabled'];
  const line=document.createElement('div');line.className='step-overview-line';
  const tag=document.createElement('span');tag.className='step-overview-tag';tag.textContent='Zwischenschritt '+n;
  const val=document.createElement('span');val.className='step-overview-val';
  val.textContent=enabled?((t[prefix+'Name']||'Aktion noch nicht benannt')+' · nach '+format(t[prefix+'H']*3600+t[prefix+'M']*60)):'—';
  line.append(tag,val);r.stepInfo.appendChild(line);
 }
 if(invalidAny){const warn=document.createElement('div');warn.textContent='⚠ Zwischenzeit außerhalb der Hauptzeit';r.stepInfo.appendChild(warn)}
 r.stepInfo.style.color=invalidAny?'#ffc46b':'#cdd7e3';
 r.meter.setAttribute('aria-valuenow',String(Math.round(pct)));
 r.status.textContent=t.done?'ZEIT ABGELAUFEN':lastTriggered?'ZWISCHENSCHRITT ERREICHT · '+lastTriggered:t.running?'LÄUFT':t.startedOnce?'PAUSIERT':'BEREIT';
 r.el.classList.toggle('finished',t.done);r.el.classList.toggle('running',t.running);r.el.classList.toggle('alarming',t.alarmActive);r.alarmStop.classList.toggle('hidden',!t.alarmActive);
 r.toggle.textContent=t.running?'Ⅱ Pause':t.done?'▶ Neustart':t.startedOnce?'▶ Weiter':'▶ Start';
 [r.h,r.m,r.stepH,r.stepM,r.stepOn,r.step2H,r.step2M,r.step2On].forEach(input=>input.disabled=t.running);
}}

function tick(){state.timers.forEach((t,i)=>{if(t.running)countdown(i)});processAlarms();renderValues();updateWake()}
for(let n=1;n<=8;n++){let op=document.createElement('option');op.value=n;op.textContent=n+' Timer';$('#count').appendChild(op)}$('#count').value=state.count;$('#count').addEventListener('change',e=>{closePicker();state.count=integer(e.target.value,3);save();render()});
// Lautstärke gilt für Zwischenhinweise und den wiederholten Ablaufalarm.
$('#sound').value=state.soundLevel;
$('#sound').addEventListener('change',e=>{
 state.soundLevel=e.target.value;
 for(const voice of alarmVoices.values()){
  if(audio)try{voice.gain.gain.cancelScheduledValues(audio.currentTime);voice.gain.gain.setValueAtTime(0,audio.currentTime)}catch(e){}
 }
 alarmVoices.clear();
 if(volume()>0){
  primeAudio();
  // Neue Einstellung ohne Verzögerung auf laufende Alarme anwenden.
  state.timers.forEach(t=>{if(t.alarmActive)t.nextAlarmAt=0});
 }
 processAlarms();save();
});
$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Vollbild ist in diesem Browser nicht verfügbar.')}catch(e){toast('Vollbild konnte nicht aktiviert werden.')}});
$('#allStart').addEventListener('click',()=>{primeAudio();for(let i=0;i<state.count;i++)if(!state.timers[i].running&&state.timers[i].duration)start(i)});
$('#allStop').addEventListener('click',()=>{for(let i=0;i<state.count;i++)pause(i)});
// Alle Timer ohne Browser-Bestaetigungsdialog zuruecksetzen.
// Die Anzahl sichtbarer Kanaele sowie die Toneinstellung bleiben erhalten.
$('#allReset').addEventListener('click',()=>{
 closePicker();
 for(let i=0;i<8;i++)stopAlarm(i);
 state.timers=Array.from({length:8},(_,i)=>defaultTimer(i));
 render();
 updateWake();
 toast('Alle 8 Timer wurden zurückgesetzt.');
});
window.addEventListener('resize',layout);render();tick();setInterval(tick,250);
})();
</script>
